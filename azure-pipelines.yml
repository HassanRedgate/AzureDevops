parameters:
  - name: longLivedBranch
    displayName: "Long-lived branch (generation is locked to this branch)"
    type: string
    default: master

  - name: skipGenerate
    displayName: "Skip migration generation (promote existing migrations only)"
    type: boolean
    default: false

  # Default must not be empty: ADO marks an empty-default string parameter
  # Required and greys out the Run button.
  - name: descriptionOverride
    displayName: "Migration description, or 'auto' to derive it from the merge commit"
    type: string
    default: auto

# Literal branch name required. A ${{ }} expression here fails to compile.
# Keep in sync with the longLivedBranch parameter.
trigger:
  branches:
    include:
      - master

# No `pr:` trigger: ADO ignores it for Azure Repos Git. PR validation comes
# from a Build Validation branch policy on the long-lived branch.
pool:
  name: "VirtualMachinePool"

variables:
  - group: distro_pipeline_vars

  - name: LongLivedBranch
    value: ${{ parameters.longLivedBranch }}

  - name: DryRunDir
    value: $(Build.ArtifactStagingDirectory)\dry-run

  - name: PreviewDir
    value: $(Build.ArtifactStagingDirectory)\preview

stages:
  - stage: PRReview
    displayName: "PR review reports"
    condition: eq(variables['Build.Reason'], 'PullRequest')
    variables:
      - group: distro_build_credentials
    jobs:
      - job: SchemaModelDiff
        steps:
          - checkout: self

          - powershell: |
              New-Item -ItemType Directory -Force -Path "$(PreviewDir)" | Out-Null
            displayName: "Create the preview output folder"

          - template: templates/steps-resolve-auth.yml
            parameters:
              environmentName: shadow
              outputVariable: ShadowAuth

          - script: |
              flyway -configFiles=flyway.toml $(ShadowAuth) ^
                diff generate ^
                -diff.source=schemaModel -diff.target=migrations -diff.buildEnvironment=shadow ^
                -diff.artifactFilename=$(Build.ArtifactStagingDirectory)\flyway.diff ^
                -generate.types=versioned ^
                -generate.location=$(PreviewDir) ^
                -generate.description=PR$(System.PullRequest.PullRequestId)_preview
            displayName: "Diff schema model and generate the prospective migration"
            env:
              environments_shadow_url: $(target_database_JDBC)

          - powershell: |
              $files = Get-ChildItem -Path "$(PreviewDir)" -Filter "*.sql" -ErrorAction SilentlyContinue

              if (-not $files) {
                Set-Content -Path "$(PreviewDir)\no-migration-generated.txt" `
                  -Value "This PR changes no schema model objects, so no migration would be generated on merge."
                Write-Host "No schema model changes in this PR. Nothing would be generated on merge."
                exit 0
              }

              Write-Host "On merge to $(LongLivedBranch), this PR will generate:"
              Write-Host ""
              foreach ($f in $files) {
                Write-Host "===================================================="
                Write-Host "$($f.Name)"
                Write-Host "===================================================="
                Get-Content $f.FullName | Write-Host
                Write-Host ""
              }
              Write-Host "The committed filename will differ: the real migration is named from the merge commit, not from the PR id."
            displayName: "Show the prospective migration SQL in the log"

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: pr-review-reports
            displayName: "Publish the prospective migration for the reviewer"

  - stage: GenerateMigration
    displayName: "Generate and commit migration"
    dependsOn: []
    condition: >-
      and(
        ne(variables['Build.Reason'], 'PullRequest'),
        eq(variables['Build.SourceBranch'], 'refs/heads/${{ parameters.longLivedBranch }}'),
        ${{ eq(parameters.skipGenerate, false) }}
      )
    variables:
      - group: distro_build_credentials
    jobs:
      - job: Generate
        steps:
          - checkout: self
            clean: true
            persistCredentials: true # required for the push back

          - powershell: |
              $branch = "$(LongLivedBranch)"

              git config user.email "azuredevops-build@noreply.local"
              git config user.name "Azure DevOps Build"

              git fetch origin $branch
              git checkout -B $branch --track origin/$branch

              $override = "${{ parameters.descriptionOverride }}"
              if ($override -and $override -ne "auto") {
                $raw = $override
              } else {
                # Subject line only. The PR description follows on later
                # lines and would otherwise end up in the filename.
                $raw = ("$env:BUILD_SOURCEVERSIONMESSAGE" -split "`n")[0].Trim()
                if ($raw -match '^Merged PR \d+:\s*(.+)$') { $raw = $Matches[1] }
              }

              $desc = ($raw -replace '[^A-Za-z0-9]+', '_').Trim('_')
              if ($desc.Length -gt 60) { $desc = $desc.Substring(0, 60).Trim('_') }
              if (-not $desc) { $desc = "SchemaModelUpdate" }

              Write-Host "Migration description: $desc"
              Write-Host "##vso[task.setvariable variable=MigrationDescription]$desc"
            displayName: "Attach to $(LongLivedBranch), derive description"

          - template: templates/steps-resolve-auth.yml
            parameters:
              environmentName: shadow
              outputVariable: ShadowAuth

          - script: |
              flyway -configFiles=flyway.toml $(ShadowAuth) ^
                diff generate ^
                -diff.source=schemaModel -diff.target=migrations -diff.buildEnvironment=shadow ^
                -generate.types=versioned ^
                -generate.description="$(MigrationDescription)"
            displayName: "Diff schema model against shadow, generate migration"
            env:
              environments_shadow_url: $(target_database_JDBC)

          - powershell: |
              if (-not (Test-Path migrations)) {
                Write-Host "No migrations folder, nothing was generated."
                exit 0
              }
              Get-ChildItem migrations -Filter "V*.sql" |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 3 |
                ForEach-Object {
                  Write-Host "--- $($_.Name) ---"
                  Get-Content $_.FullName | Write-Host
                  Write-Host ""
                }
            displayName: "Show generated SQL in the log"

          - powershell: |
              $branch = "$(LongLivedBranch)"

              function Set-NotGenerated {
                Write-Host "##vso[task.setvariable variable=MigrationGenerated]false"
              }

              if (-not (Test-Path migrations)) {
                Write-Host "No migrations folder, so nothing was generated. Nothing to commit."
                Set-NotGenerated
                exit 0
              }

              # -f because Desktop's .gitignore can exclude this path.
              git add -f migrations
              $changes = git status --porcelain -- migrations
              if (-not $changes) {
                Write-Host "No schema model changes to generate a migration for. Nothing to commit."
                Set-NotGenerated
                exit 0
              }
              Write-Host "Committing generated migration:"
              Write-Host $changes

              # ***NO_CI*** stops this push retriggering the pipeline.
              git commit -m "Add generated migration: $(MigrationDescription) ***NO_CI***"

              git fetch origin $branch
              git rebase origin/$branch
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Rebase onto origin/$branch failed. Resolve manually, nothing has been pushed."
                exit 1
              }

              git push origin HEAD:$branch
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Push to $branch was rejected. Check the build service identity has Contribute permission and is exempt from branch policies on $branch."
                exit 1
              }

              Write-Host "##vso[task.setvariable variable=MigrationGenerated]true"
            displayName: "Commit and push generated migration"

          # Conditional because publish hard-fails on a missing path.
          - publish: migrations
            artifact: generated-migration
            displayName: "Publish migrations folder for the audit trail"
            condition: eq(variables['MigrationGenerated'], 'true')

  - stage: DryRun
    displayName: "Dry run: SQL each environment will get"
    dependsOn: GenerateMigration
    condition: >-
      and(
        ne(variables['Build.Reason'], 'PullRequest'),
        in(dependencies.GenerateMigration.result, 'Succeeded', 'Skipped', 'SucceededWithIssues')
      )
    jobs:
      - template: templates/job-dry-run.yml
        parameters:
          jobName: DryRunTest1
          displayName: "Dry run: test1"
          credentialsGroup: distro_test1_credentials

      - template: templates/job-dry-run.yml
        parameters:
          jobName: DryRunUat
          displayName: "Dry run: uat"
          credentialsGroup: distro_uat_credentials

      - template: templates/job-dry-run.yml
        parameters:
          jobName: DryRunProd
          displayName: "Dry run: prod"
          credentialsGroup: distro_prod_credentials

  - template: templates/stage-deploy.yml
    parameters:
      stageName: DeployTest1
      jobName: MigrateTest1
      displayName: "Deploy to test1"
      dependsOn: DryRun
      adoEnvironment: DistroTest1
      credentialsGroup: distro_test1_credentials
      condition: >-
        and(
          ne(variables['Build.Reason'], 'PullRequest'),
          in(dependencies.DryRun.result, 'Succeeded', 'SucceededWithIssues')
        )

  - template: templates/stage-deploy.yml
    parameters:
      stageName: DeployUat
      jobName: MigrateUat
      displayName: "Deploy to UAT"
      dependsOn: DeployTest1
      adoEnvironment: DistroUat
      credentialsGroup: distro_uat_credentials

  - template: templates/stage-deploy.yml
    parameters:
      stageName: DeployProd
      jobName: MigrateProd
      displayName: "Deploy to Prod"
      dependsOn: DeployUat
      adoEnvironment: DistroProd
      credentialsGroup: distro_prod_credentials
